spring.application.name=reservation
server.port=${PORT:8080}

# ── PostgreSQL ────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ── Cache (Redis not available on free plan, using simple) ────────
spring.cache.type=simple

# ??? Redis Cloud ??????????????????????????????????????????????
#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.password=${REDIS_PASSWORD}
#spring.data.redis.username=${REDIS_USER}

# ── Mail ──────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# ── Stripe ────────────────────────────────────────────────────────
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}

# ── JWT ───────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Logging ───────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=INFO
logging.level.system.ticket.reservation=INFO

# ── Swagger ───────────────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Duffel API ────────────────────────────────────────────────────
duffel.api.url=https://api.duffel.com
duffel.api.token=${DUFFEL_API_TOKEN}
duffel.api.version=v2

# ── HikariCP ──────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ── Tomcat ────────────────────────────────────────────────────────
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
